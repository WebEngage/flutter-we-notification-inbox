group = 'com.webengage.we_notificationinbox_flutter'
version = '2.2.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace = "com.webengage.we_notificationinbox_flutter"
    compileSdk = 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDir 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 21
        manifestPlaceholders = [we_fl_ni_version: readVersion()]
    }
}

plugins.withId("org.jetbrains.kotlin.android") {
    def kotlinExtension = project.extensions.getByName("kotlin")
    if (kotlinExtension.hasProperty("compilerOptions")) {
        kotlinExtension.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    } else {
        android.kotlinOptions.jvmTarget = '1.8'
    }
}

String readVersion() {
    def version = new Properties()
    def stream
    try {
        stream = new FileInputStream(new File(projectDir, 'version.properties'))
        version.load(stream)
    } catch (FileNotFoundException ignore) {
    } finally {
        if (stream != null) stream.close()
    }
    // safety defaults in case file is missing
    if(!version['major']) version['major'] = "1"
    if(!version['minor']) version['minor'] = "0"
    if(!version['patch']) version['patch'] = "0"
    return "${version['major']}.${version['minor']}.${version['patch']}"
}

dependencies {
    implementation 'com.webengage:android-sdk:[5,)'
    implementation 'com.webengage:we-notification-inbox:[1.1,)'
}
