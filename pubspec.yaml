name: we_notificationinbox_flutter
description: WE-NotififcationInbox-Plugin
version: 2.0.0
homepage: https://webengage.com/

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.webengage.we_notificationinbox_flutter
        pluginClass: WENotificationInboxFlutterPlugin
      ios:
        pluginClass: WENotificationInboxFlutterPlugin
        swiftPackageManager:
          path: ios/we_notificationinbox_flutter/

  
